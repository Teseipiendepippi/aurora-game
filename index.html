*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:ui-rounded,system-ui,-apple-system,'Segoe UI',sans-serif;color:#fff;background:#172f45}button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}#app{position:relative;height:100dvh;min-height:580px;max-width:560px;margin:auto;overflow:hidden;background:linear-gradient(180deg,#4b819b 0%,#a8b8aa 49%,#cba77f 100%)}.sky{position:absolute;inset:0;transition:filter .7s}.sky:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 75% 17%,#fff0ba 0 5%,#fff0ba44 7%,transparent 25%),linear-gradient(180deg,#396d92,#c4a98d 65%,#f4c88b)}.mount{position:absolute;bottom:23%;width:150%;left:-25%;height:49%;background:#476f80;clip-path:polygon(0 100%,0 76%,13% 53%,24% 70%,40% 24%,55% 62%,70% 32%,85% 70%,100% 45%,100% 100%);opacity:.76}.mount.m2{bottom:12%;height:40%;background:#315d6a;transform:scaleX(-1);opacity:.9}.lake{position:absolute;bottom:0;width:100%;height:39%;background:linear-gradient(180deg,#6c9b9b,#315c69 65%,#163c52)}.lake:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(175deg,transparent 0 19px,#d2ded222 20px 22px,transparent 23px 39px)}.tree{position:absolute;bottom:12%;width:100px;height:230px;background:#173e48;clip-path:polygon(49% 0,78% 35%,65% 35%,94% 65%,71% 65%,100% 91%,56% 91%,56% 100%,43% 100%,43% 91%,0 91%,27% 65%,8% 65%,35% 35%,23% 35%);opacity:.7}.tree.t1{left:-55px}.tree.t2{right:-60px;transform:scale(.82)}.theme1 .sky:before{background:radial-gradient(circle at 75% 17%,#fff5cf 0 5%,transparent 24%),linear-gradient(#3d7190,#b4bba8 60%,#edbd8d)}.theme2 .sky:before{background:radial-gradient(circle at 70% 15%,#ffe5c2 0 6%,transparent 26%),linear-gradient(#6d5c98,#e89b9a 65%,#edb783)}.theme2 .mount{background:#625d87}.theme2 .mount.m2{background:#403f72}.theme2 .lake{background:linear-gradient(#b17b9d,#493e73)}.theme3 .sky:before{background:radial-gradient(circle at 75% 16%,#ffebac 0 5%,transparent 22%),linear-gradient(#0b4b71,#2b8c9b 60%,#a4c9b6)}.theme3 .mount{background:#3a7c77}.theme3 .mount.m2{background:#15565d}.theme3 .lake{background:linear-gradient(#59ada8,#155667)}.theme4 .sky:before{background:radial-gradient(circle at 72% 18%,#f5f6ff 0 4%,transparent 20%),linear-gradient(#101d50,#535e9a 65%,#ae85b6)}.theme4 .mount{background:#343c6d}.theme4 .mount.m2{background:#20264e}.theme4 .lake{background:linear-gradient(#575b94,#1b2857)}.stars{position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(#ffffffa8 1px,transparent 1px);background-size:47px 57px;opacity:0}.theme4 .stars{opacity:.7}.overlay{position:absolute;inset:0;background:linear-gradient(180deg,#0b203a55,transparent 35%,#09213655 100%);pointer-events:none}.top{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 18px) 22px 0}.logo{font-family:Georgia,serif;font-size:29px;font-weight:bold;letter-spacing:4px;text-shadow:0 3px 12px #0a263d99}.sub{font-size:10px;letter-spacing:3px;text-transform:uppercase;opacity:.82;margin-top:3px}.pill{background:#ffffff25;border:1px solid #ffffff55;border-radius:50px;padding:9px 13px;backdrop-filter:blur(12px);font-weight:750}.panel{position:relative;z-index:2;text-align:center;margin:22px 20px 0}.chapter{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:#f6e5bd;font-weight:700}.panel h1{font-family:Georgia,serif;font-size:clamp(27px,7vw,38px);margin:7px 0 3px;text-shadow:0 3px 12px #1d314a99}.panel p{margin:0;font-size:13px;color:#f5f4e9}.progress{height:5px;background:#ffffff40;border-radius:12px;margin:18px auto 0;width:70%;overflow:hidden}.progress>div{height:100%;background:#ffe4a5;width:0;transition:width .3s}.board{position:relative;z-index:2;margin:clamp(15px,3vh,27px) auto 0;display:flex;align-items:center;justify-content:center;align-content:center;flex-wrap:wrap;gap:9px 7px;max-width:340px;min-height:140px;padding:5px 20px}.word{display:flex;gap:5px;justify-content:center}.cell{width:clamp(32px,9vw,43px);height:clamp(39px,10vw,48px);border-radius:11px;background:#f8f2e6df;border-bottom:4px solid #b8c6bc;color:#244657;display:grid;place-items:center;font-size:23px;font-weight:800;box-shadow:0 6px 15px #18334425}.cell.empty{background:#f6f4e33a;border:2px solid #ffffff88;border-bottom:4px solid #ffffff80}.cell.hint{background:#ffedb2}.found{animation:pop .32s ease}@keyframes pop{50%{transform:scale(1.13)}}.play{position:absolute;z-index:3;bottom:calc(env(safe-area-inset-bottom) + 22px);left:0;right:0;display:flex;flex-direction:column;align-items:center}.entry{height:40px;font-size:25px;letter-spacing:5px;font-weight:800;text-shadow:0 3px 10px #163b4a;display:flex;align-items:center}.wheel{width:min(70vw,265px);height:min(70vw,265px);max-height:32vh;max-width:32vh;min-width:205px;min-height:205px;position:relative;border-radius:50%;background:#f3f6ef22;border:1px solid #ffffff55;box-shadow:0 15px 60px #082a3c55,inset 0 0 45px #ffffff10;backdrop-filter:blur(10px);touch-action:none;user-select:none}.wheel svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.letter{position:absolute;transform:translate(-50%,-50%);width:23%;height:23%;border:0;border-radius:50%;background:linear-gradient(145deg,#fffdf5,#e8e9e0);color:#244b59;font-size:clamp(21px,5.5vw,30px);font-weight:850;box-shadow:0 7px 0 #bcc5bc,0 10px 19px #092a3c77;display:grid;place-items:center;pointer-events:none}.letter.active{background:linear-gradient(145deg,#ffedb3,#ffd48b);transform:translate(-50%,-50%) scale(1.08);box-shadow:0 5px 0 #bfa26b,0 10px 20px #092a3c66}.actions{display:flex;gap:13px;margin-top:16px}.action{border:1px solid #ffffff6b;color:white;background:#143c55a8;border-radius:24px;padding:11px 18px;box-shadow:0 5px 17px #102d4055;font-size:13px;font-weight:750;backdrop-filter:blur(12px)}.action.gold{background:#ffe6a4;color:#31495b;border-color:#fff0c2}.toast{position:absolute;z-index:10;top:42%;left:50%;transform:translate(-50%,-50%);background:#14384eea;border:1px solid #ffffff60;padding:13px 22px;border-radius:16px;white-space:nowrap;opacity:0;transition:opacity .2s;pointer-events:none;font-weight:700}.toast.show{opacity:1}.modal{position:absolute;z-index:20;inset:0;background:#0b2639bd;display:none;align-items:center;justify-content:center;padding:25px;backdrop-filter:blur(8px)}.modal.show{display:flex}.modalbox{background:linear-gradient(150deg,#fffaf0,#e8e9d9);color:#29475a;border-radius:28px;text-align:center;padding:30px 24px;width:100%;max-width:340px;box-shadow:0 25px 70px #091d2b88}.modalbox .emoji{font-size:54px}.modalbox h2{font-family:Georgia,serif;font-size:31px;margin:10px 0}.modalbox p{font-size:15px;line-height:1.5}.primary{border:0;background:#245c6b;color:white;border-radius:15px;padding:15px 22px;font-weight:800;width:100%;margin-top:10px}.footnote{position:absolute;z-index:2;bottom:4px;left:0;right:0;text-align:center;font-size:9px;color:#ffffff8c;pointer-events:none}@media(max-height:730px){.panel{margin-top:8px}.board{margin-top:8px;min-height:100px}.play{bottom:calc(env(safe-area-inset-bottom) + 8px)}.actions{margin-top:8px}.entry{height:32px}}
</style></head><body><div id="app" class="theme1"><div class="sky"><div class="mount"></div><div class="mount m2"></div><div class="lake"></div><div class="tree t1"></div><div class="tree t2"></div><div class="stars"></div></div><div class="overlay"></div><header class="top"><div><div class="logo">LETTERIA</div><div class="sub">Viaggio tra le parole</div></div><button class="pill" id="coins">✦ 100</button></header><section class="panel"><div class="chapter" id="chapter">CAPITOLO I · LE VETTE</div><h1 id="title">Il primo orizzonte</h1><p id="desc">Traccia le lettere. Scopri le parole.</p><div class="progress"><div id="bar"></div></div></section><main class="board" id="board"></main><section class="play"><div class="entry" id="entry"></div><div class="wheel" id="wheel"><svg id="lines" viewBox="0 0 260 260"><polyline id="trace" points="" fill="none" stroke="#ffe7a0" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/></svg></div><div class="actions"><button class="action" id="shuffle">⤨ Mescola</button><button class="action gold" id="hint">✦ Suggerimento · 25</button></div></section><div class="toast" id="toast"></div><div class="modal" id="modal"><div class="modalbox"><div class="emoji">✦</div><h2>Meraviglioso!</h2><p id="result">Hai completato il livello.</p><button class="primary" id="next">Continua il viaggio →</button></div></div><div class="footnote">LETTERIA · Un viaggio originale tra le parole</div></div><script>
const levels=[
{letters:'CASA',words:['CASA','SACA'],title:'Il primo orizzonte',theme:1},
{letters:'MARE',words:['MARE','REMA','ARME'],title:'La costa dorata',theme:2},
{letters:'SOLE',words:['SOLE','LESO','OSLE'],title:'Luce del mattino',theme:3},
{letters:'LUNA',words:['LUNA','UNA','ULNA'],title:'Sotto le stelle',theme:4},
{letters:'RISO',words:['RISO','ORSI','SORI'],title:'Il sentiero segreto',theme:1},
{letters:'CANE',words:['CANE','CENA','NACE'],title:'Il bosco incantato',theme:2},
{letters:'PANE',words:['PANE','PENA','APE'],title:'Profumo di casa',theme:3},
{letters:'NOTTE',words:['NOTTE','NOTE','TONE'],title:'Il cielo di velluto',theme:4},
{letters:'PORTA',words:['PORTA','PRATO'],title:'La valle nascosta',theme:1},
{letters:'FIORE',words:['FIORE','FERO','FIER'],title:'Il giardino sospeso',theme:2},
{letters:'VENTO',words:['VENTO','NOTE','VETO'],title:'Il vento gentile',theme:3},
{letters:'STELLA',words:['STELLA','STELLA','TELA'],title:'La costellazione',theme:4}
];
// Keep only familiar Italian vocabulary and no duplicate answers.
levels[0].words=['CASA'];levels[2].words=['SOLE','LESO'];levels[4].words=['RISO','ORSI'];levels[5].words=['CANE','CENA'];levels[7].words=['NOTTE','NOTE'];levels[8].words=['PORTA','PRATO'];levels[9].words=['FIORE'];levels[11].words=['STELLA','TELA','SALE'];
const extra=['AMORE','CUORE','FESTA','PIANO','TEMPO','FONTE','SOGNO','MONTE','PISTA','TERRA','FIUME','VERDE','PIENO','LENTO','SALTO'];
for(let i=0;i<extra.length;i++){const w=extra[i];levels.push({letters:w,words:[w],title:['Nuovi orizzonti','Il sentiero delle parole','La luce del viaggio','Il cielo infinito'][i%4],theme:i%4+1});}
let level=Math.max(0,Math.min(levels.length-1,Number(localStorage.getItem('letteria_level')||0))),coins=Math.max(0,Number(localStorage.getItem('letteria_coins')||100)),found=[],order=[],selected=[],dragging=false,coords=[],toastTimer;
const $=id=>document.getElementById(id);function save(){localStorage.setItem('letteria_level',level);localStorage.setItem('letteria_coins',coins)}function say(t){$('toast').textContent=t;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),1500)}function setup(){let l=levels[level];found=[];selected=[];$('modal').classList.remove('show');$('app').className='theme'+l.theme;$('chapter').textContent='CAPITOLO '+String(Math.floor(level/4)+1).padStart(2,'0')+' · LIVELLO '+(level+1);$('title').textContent=l.title;$('desc').textContent='Trova '+l.words.length+' parole nascoste';order=[...l.letters].map((c,i)=>({c,i}));draw();save()}
function draw(){let l=levels[level];$('coins').textContent='✦ '+coins;$('bar').style.width=(found.length/l.words.length*100)+'%';$('board').innerHTML='';l.words.forEach((w,wi)=>{let row=document.createElement('div');row.className='word';row.dataset.word=w;[...w].forEach((c,i)=>{let el=document.createElement('div');el.className='cell '+(found.includes(w)?'found':'empty');el.textContent=found.includes(w)?c:'';row.append(el)});$('board').append(row)});let wheel=$('wheel');wheel.querySelectorAll('.letter').forEach(n=>n.remove());coords=[];let n=order.length;order.forEach((item,i)=>{let a=-Math.PI/2+i*Math.PI*2/n,x=50+34*Math.cos(a),y=50+34*Math.sin(a);coords.push({x:x*2.6,y:y*2.6});let b=document.createElement('div');b.className='letter';b.style.left=x+'%';b.style.top=y+'%';b.textContent=item.c;b.dataset.i=i;wheel.append(b)});renderSelection()}
function renderSelection(){let word=selected.map(i=>order[i].c).join('');$('entry').textContent=word||'· · ·';document.querySelectorAll('.letter').forEach(e=>e.classList.toggle('active',selected.includes(+e.dataset.i)));$('trace').setAttribute('points',selected.map(i=>coords[i].x+','+coords[i].y).join(' '))}
function add(i){if(i<0||selected.includes(i))return;selected.push(i);renderSelection();if(navigator.vibrate)navigator.vibrate(8)}function locate(e){let r=$('wheel').getBoundingClientRect(),x=(e.clientX-r.left)/r.width*260,y=(e.clientY-r.top)/r.height*260;return coords.findIndex(p=>Math.hypot(p.x-x,p.y-y)<35)}function start(e){dragging=true;selected=[];try{$('wheel').setPointerCapture(e.pointerId)}catch{}add(locate(e))}function move(e){if(dragging)add(locate(e))}function end(){if(!dragging)return;dragging=false;let w=selected.map(i=>order[i].c).join(''),l=levels[level];if(l.words.includes(w)&&!found.includes(w)){found.push(w);coins+=10;save();say('✦ '+w+'  +10');draw();if(found.length===l.words.length){setTimeout(()=>{$('result').textContent='Hai trovato tutte le parole e guadagnato '+(l.words.length*10)+' stelle!';$('modal').classList.add('show')},700)}}else if(w){say(found.includes(w)?'Già trovata!':'Riprova ✧')}selected=[];renderSelection()}
$('wheel').addEventListener('pointerdown',start);$('wheel').addEventListener('pointermove',move);$('wheel').addEventListener('pointerup',end);$('wheel').addEventListener('pointercancel',end);$('shuffle').onclick=()=>{for(let i=order.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}draw();say('Lettere mescolate')};$('hint').onclick=()=>{if(coins<25){say('Servono 25 stelle');return}let word=levels[level].words.find(w=>!found.includes(w));if(!word)return;coins-=25;found.push(word);save();draw();say('Suggerimento: '+word);if(found.length===levels[level].words.length)setTimeout(()=>$('modal').classList.add('show'),700)};$('next').onclick=()=>{level=(level+1)%levels.length;setup()};$('coins').onclick=()=>say('Guadagna 10 stelle per ogni parola!');setup();
</script></body></html>
