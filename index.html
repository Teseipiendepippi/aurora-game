
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#25113e">
<title>AURORA - Le Isole delle Parole</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#100b25;color:white;font-family:system-ui,Arial,sans-serif}
button{font:inherit;cursor:pointer}
#app{max-width:520px;min-height:100dvh;margin:auto;position:relative;overflow:hidden;background:radial-gradient(circle at 75% 12%,#dcb3ff55,transparent 25%),linear-gradient(#29164f,#66448c 52%,#1b143c)}
#app:before{content:"✦　✧　　 ✦　　 ✧　 ✦";position:absolute;top:12%;left:4%;color:#ffe4aa88;font-size:24px;letter-spacing:15px;pointer-events:none}
header{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;padding:25px 18px 12px}
.logo{font: bold 30px Georgia,serif;letter-spacing:4px;color:#ffe4a5;text-shadow:0 3px 15px #000}
.small{font-size:10px;letter-spacing:2px;color:#e7d5ff}
.coins{background:#ffffff20;border:1px solid #ffe5aa80;border-radius:22px;padding:10px 15px;color:#ffe4a5;font-weight:bold}
.screen{display:none;position:relative;z-index:1;padding:12px 18px 30px;text-align:center}
.screen.active{display:block}
h1,h2,h3{font-family:Georgia,serif;color:#ffe1a1}
h1{font-size:29px;margin:8px 0}
h2{font-size:25px}
p{color:#e5d7f5}
.btn{border:1px solid #ffe0a5;background:linear-gradient(#fbe7ac,#c8964a);color:#35214e;font-weight:800;border-radius:17px;padding:13px 20px;box-shadow:0 5px 0 #78502b}
.btn.secondary{background:#553579;color:#fff;border-color:#bda0eb;box-shadow:0 5px 0 #291746}
.island{margin:18px auto;padding:18px 12px;border:1px solid #dfc39488;border-radius:25px;background:linear-gradient(145deg,#8052a777,#261646bb);box-shadow:0 12px 30px #10051d77}
.island .art{font-size:55px;margin:8px}
.island h2{margin:8px}
.island p{font-size:13px;margin:7px 0 18px}
.nodes{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.node{aspect-ratio:1;border-radius:50%;border:2px solid #ffe0a5;background:linear-gradient(#ffe6a6,#c59347);color:#322048;font-weight:900;box-shadow:0 4px 0 #7e582c}
.node.done{background:linear-gradient(#e4c9ff,#9262c3);border-color:#e9ceff}
.node.current{outline:3px solid #e6bfff;outline-offset:2px}
.node.locked{background:#3a2c57;color:#8c7da9;border-color:#6b5688;box-shadow:none}
.node:disabled{cursor:default}
#game{min-height:calc(100dvh - 100px)}
.levelhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.levelhead .btn{padding:9px 12px;font-size:13px}
.chapter{font-size:12px;letter-spacing:2px;color:#fce3aa;margin-top:14px}
#levelTitle{margin:8px 0 5px}
#description{font-size:13px;margin:0}
.progress{height:7px;background:#ffffff30;border-radius:10px;margin:16px auto;max-width:300px;overflow:hidden}
#bar{height:100%;width:0;background:#ffe0a5;transition:width .3s}
#board{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:150px;margin:12px auto}
.word{display:flex;gap:5px}
.cell{width:clamp(30px,8vw,43px);height:clamp(39px,10vw,48px);display:grid;place-items:center;border-radius:9px;background:#fff2d9;color:#38234f;font-size:21px;font-weight:900;border-bottom:4px solid #bd9c67}
.cell.empty{background:#ffffff20;border:2px solid #ffffff85;border-bottom:4px solid #ffffff55}
#entry{font-size:26px;font-weight:900;letter-spacing:4px;height:43px;margin-top:10px}
#wheel{width:min(69vw,260px);height:min(69vw,260px);min-width:205px;min-height:205px;margin:4px auto 16px;border-radius:50%;position:relative;touch-action:none;user-select:none;background:#ffffff17;border:1px solid #ffffff70;box-shadow:0 15px 45px #10062588}
#wheel svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.letter{position:absolute;width:24%;height:24%;border-radius:50%;transform:translate(-50%,-50%);display:grid;place-items:center;background:linear-gradient(#fff9e7,#e2cfad);color:#3c2756;font-size:clamp(22px,6vw,30px);font-weight:900;box-shadow:0 6px 0 #aa906a;pointer-events:none}
.letter.on{background:linear-gradient(#fff1b5,#f4bc64);box-shadow:0 5px 0 #a57937}
.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.actions .btn{font-size:12px;padding:12px}
#message{min-height:25px;margin-top:13px;color:#ffe5aa;font-weight:700}
#overlay{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;background:#0c0825dd;padding:25px}
#overlay.show{display:flex}
.modal{width:min(100%,350px);border:2px solid #f4d6a2;border-radius:26px;background:linear-gradient(#6b4799,#281742);padding:25px;text-align:center;box-shadow:0 25px 70px #0009}
.modal .art{font-size:65px}
.modal .btn{width:100%;margin-top:12px}
footer{text-align:center;color:#bda8d8;font-size:10px;padding:15px}
@media(max-height:720px){header{padding-top:12px}.screen{padding-top:3px}#board{min-height:100px;margin:4px auto}#wheel{width:205px;height:205px}#entry{margin-top:0}.chapter{margin-top:5px}}
</style>
</head>
<body>
<div id="app">
<header>
<div>
<div class="logo">AURORA</div>
<div class="small">LE ISOLE DELLE PAROLE</div>
</div>
<div class="coins" id="coins">✦ 100</div>
</header>

<section id="map" class="screen active">
<h1>✦ I Regni Magici ✦</h1>
<p>Un viaggio tra parole, stelle e misteri</p>
<div id="islands"></div>
</section>

<section id="game" class="screen">
<div class="levelhead">
<button class="btn secondary" id="back">← Mappa</button>
<span id="levelNumber">Livello 1</span>
</div>
<div class="chapter" id="chapter"></div>
<h1 id="levelTitle"></h1>
<p id="description"></p>
<div class="progress"><div id="bar"></div></div>
<div id="board"></div>
<div id="entry">· · ·</div>
<div id="wheel">
<svg viewBox="0 0 260 260">
<polyline id="trace" fill="none" stroke="#ffe3a0" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" points=""/>
</svg>
</div>
<div class="actions">
<button class="btn secondary" id="shuffle">⤨ Mescola</button>
<button class="btn" id="hint">✦ Aiuto · 25</button>
</div>
<div id="message"></div>
</section>

<footer>AURORA · Un'avventura tra le parole</footer>
</div>

<div id="overlay">
<div class="modal">
<div class="art" id="winArt">🏆</div>
<h2 id="winTitle">Livello completato!</h2>
<p id="winText">Hai trovato tutte le parole!</p>
<button class="btn" id="next">Continua il viaggio →</button>
<button class="btn secondary" id="winMap">Torna alla mappa</button>
</div>
</div>

<script>
"use strict";

const data=[
["CASA","CASA","Il primo orizzonte"],
["MARE","MARE,REMA,ARME","La costa dorata"],
["SOLE","SOLE,LESO","Luce del mattino"],
["LUNA","LUNA,UNA,ULNA","Sotto le stelle"],
["RISO","RISO,ORSI","Il sentiero segreto"],
["CANE","CANE,CENA","Il bosco incantato"],
["PANE","PANE,PENA,APE","Profumo di casa"],
["NOTTE","NOTTE,NOTE","Il cielo di velluto"],
["PORTA","PORTA,PRATO","La valle nascosta"],
["FIORE","FIORE","Il giardino sospeso"],
["VENTO","VENTO,NOTE,VETO","Il vento gentile"],
["STELLA","STELLA,TELA,SALE","La costellazione"],
["AMORE","AMORE","Il cuore della luna"],
["CUORE","CUORE","La luce segreta"],
["FESTA","FESTA","La notte dei desideri"],
["PIANO","PIANO","Il ponte stellato"],
["TEMPO","TEMPO","L'orologio incantato"],
["FONTE","FONTE","La sorgente lunare"],
["SOGNO","SOGNO","Il castello dei sogni"],
["MONTE","MONTE","La vetta argentata"],
["PISTA","PISTA","Il cammino dei draghi"],
["TERRA","TERRA","Il regno di cristallo"],
["FIUME","FIUME","Il fiume di fuoco"],
["VERDE","VERDE","La foresta antica"],
["PIENO","PIENO","Il tesoro nascosto"],
["LENTO","LENTO","La caverna misteriosa"],
["SALTO","SALTO","Le ali del drago"],
["MAGIA","MAGIA","Il potere delle stelle"],
["DRAGO","DRAGO","Il guardiano del cielo"],
["PERLA","PERLA","La corona di Aurora"]
];

const levels=data.map(x=>({
letters:x[0],
words:x[1].split(","),
title:x[2]
}));

const realms=[
{name:"Isola dell'Alba",art:"🏰🌅",desc:"Il risveglio della magia · Livelli 1–10"},
{name:"Regno della Luna",art:"🌙🔮",desc:"Tra stelle e misteri · Livelli 11–20"},
{name:"Isola dei Draghi",art:"🐉💎",desc:"Il regno dei cristalli · Livelli 21–30"}
];

const $=id=>document.getElementById(id);

function readNumber(key,fallback){
const n=Number(localStorage.getItem(key));
return Number.isFinite(n)?n:fallback;
}

let level=Math.max(0,Math.min(29,readNumber(
"aurora_level",
readNumber("letteria_level",0)
)));

let coins=Math.max(0,readNumber(
"aurora_coins",
readNumber("letteria_coins",100)
));

let unlocked=Math.max(level,Math.min(29,
readNumber("aurora_unlocked",level)
));

let found=[];
let order=[];
let selected=[];
let coords=[];
let dragging=false;
let finished=false;

function save(){
localStorage.setItem("aurora_level",level);
localStorage.setItem("aurora_coins",coins);
localStorage.setItem("aurora_unlocked",unlocked);
}

function updateCoins(){
$("coins").textContent="✦ "+coins;
}

function showScreen(name){
$("map").classList.toggle("active",name==="map");
$("game").classList.toggle("active",name==="game");
window.scrollTo(0,0);
}

function renderMap(){
updateCoins();
$("islands").innerHTML="";
realms.forEach((realm,k)=>{
const start=k*10;
const box=document.createElement("div");
box.className="island";
const art=document.createElement("div");
art.className="art";
art.textContent=unlocked<start?"🔒":realm.art;
const title=document.createElement("h2");
title.textContent=realm.name;
const desc=document.createElement("p");
desc.textContent=realm.desc;
const nodes=document.createElement("div");
nodes.className="nodes";

for(let i=start;i<start+10;i++){
const b=document.createElement("button");
b.className="node";
if(i>unlocked){
b.classList.add("locked");
b.textContent="🔒";
b.disabled=true;
}else{
b.textContent=i+1;
if(i<unlocked)b.classList.add("done");
if(i===level)b.classList.add("current");
b.onclick=()=>startLevel(i);
}
nodes.appendChild(b);
}
box.append(art,title,desc,nodes);
$("islands").appendChild(box);
});
}

function openMap(){
$("overlay").classList.remove("show");
renderMap();
showScreen("map");
}

function startLevel(i){
if(i>unlocked)return;
level=i;
found=[];
selected=[];
finished=false;
order=[...levels[level].letters];
$("levelNumber").textContent="Livello "+(level+1);
$("chapter").textContent=realms[Math.floor(level/10)].name;
$("levelTitle").textContent=levels[level].title;
$("description").textContent="Trova "+levels[level].words.length+" parole nascoste";
$("message").textContent="";
$("overlay").classList.remove("show");
showScreen("game");
draw();
save();
}

function draw(){
const l=levels[level];
updateCoins();
$("bar").style.width=(found.length/l.words.length*100)+"%";
$("board").innerHTML="";

l.words.forEach(word=>{
const row=document.createElement("div");
row.className="word";
[...word].forEach(c=>{
const cell=document.createElement("div");
cell.className="cell "+(found.includes(word)?"":"empty");
cell.textContent=found.includes(word)?c:"";
row.appendChild(cell);
});
$("board").appendChild(row);
});

const wheel=$("wheel");
wheel.querySelectorAll(".letter").forEach(e=>e.remove());
coords=[];

order.forEach((c,i)=>{
const a=-Math.PI/2+i*2*Math.PI/order.length;
const x=130+88*Math.cos(a);
const y=130+88*Math.sin(a);
coords.push({x,y});
const el=document.createElement("div");
el.className="letter";
el.style.left=(x/260*100)+"%";
el.style.top=(y/260*100)+"%";
el.dataset.i=i;
el.textContent=c;
wheel.appendChild(el);
});
renderSelection();
}

function renderSelection(){
$("entry").textContent=selected.map(i=>order[i]).join("")||"· · ·";
document.querySelectorAll(".letter").forEach(el=>{
el.classList.toggle("on",selected.includes(Number(el.dataset.i)));
});
$("trace").setAttribute("points",
selected.map(i=>coords[i].x+","+coords[i].y).join(" ")
);
}

function locate(e){
const r=$("wheel").getBoundingClientRect();
const x=(e.clientX-r.left)/r.width*260;
const y=(e.clientY-r.top)/r.height*260;
return coords.findIndex(p=>Math.hypot(p.x-x,p.y-y)<36);
}

function addLetter(i){
if(i<0||selected.includes(i))return;
selected.push(i);
renderSelection();
}

function complete(){
if(finished)return;
finished=true;
unlocked=Math.max(unlocked,Math.min(level+1,29));
save();
setTimeout(()=>{
$("winArt").textContent=level===29?"👑🐉":"🏆✨";
$("winTitle").textContent=level===29?"Hai conquistato AURORA!":"Livello completato!";
$("winText").textContent=level===29?
"Hai completato tutti e 30 i livelli!":
"Hai sbloccato il prossimo livello!";
$("next").textContent=level===29?"Torna alla mappa":"Prossimo livello →";
$("overlay").classList.add("show");
},500);
}

function checkWord(){
const word=selected.map(i=>order[i]).join("");
const l=levels[level];

if(l.words.includes(word)&&!found.includes(word)){
found.push(word);
coins+=10;
$("message").textContent="✦ "+word+" · +10 monete";
save();
draw();
if(found.length===l.words.length)complete();
}else if(word){
$("message").textContent=found.includes(word)?
"Parola già trovata!":"Riprova ✧";
}
selected=[];
renderSelection();
}

const wheel=$("wheel");

wheel.addEventListener("pointerdown",e=>{
if(finished)return;
dragging=true;
selected=[];
wheel.setPointerCapture(e.pointerId);
addLetter(locate(e));
});

wheel.addEventListener("pointermove",e=>{
if(dragging)addLetter(locate(e));
});

wheel.addEventListener("pointerup",()=>{
if(!dragging)return;
dragging=false;
checkWord();
});

wheel.addEventListener("pointercancel",()=>{
dragging=false;
selected=[];
renderSelection();
});

$("shuffle").onclick=()=>{
for(let i=order.length-1;i>0;i--){
const j=Math.floor(Math.random()*(i+1));
[order[i],order[j]]=[order[j],order[i]];
}
selected=[];
draw();
$("message").textContent="Lettere mescolate ✧";
};

$("hint").onclick=()=>{
if(finished)return;
if(coins<25){
$("message").textContent="Servono 25 monete!";
return;
}
const word=levels[level].words.find(w=>!found.includes(w));
if(!word)return;
coins-=25;
found.push(word);
$("message").textContent="Suggerimento: "+word;
save();
draw();
if(found.length===levels[level].words.length)complete();
};

$("back").onclick=openMap;
$("winMap").onclick=openMap;
$("next").onclick=()=>{
$("overlay").classList.remove("show");
if(level<29)startLevel(level+1);
else openMap();
};

renderMap();
showScreen("map");
</script>
</body>
</html>
